[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-backups"
version = "3.13.3"
description = "Restura bases de datos, crea backups y limpia logs de SQL Server, todo en un solo CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlmodel>=0.0.38",
    "typer>=0.25.1",
]

[project.scripts]
mssql-backups = "mssql_backups:main"
