[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-backups"
version = "1.3.0"
description = "Aplicación de consola para restuarar base de datos en SQL Server indicando una carpeta con un listado de archivos de backup"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.13.3",
    "sqlmodel>=0.0.38",
    "typer>=0.25.1",
]

[project.scripts]
mssql-backups = "mssql_backups.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mssql_backups*"]
