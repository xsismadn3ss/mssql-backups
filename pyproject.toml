[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mssql-backups"
version = "3.13.2"
description = "Herramienta de consola para administrar configuraciones, crear backups, restaurar bases de datos de SQL Server y limpiar logs para liberar espacio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "pydantic>=2.13.3",
    "sqlmodel>=0.0.38",
    "typer>=0.25.1",
]

[project.scripts]
mssql-backups = "mssql_backups:main"
